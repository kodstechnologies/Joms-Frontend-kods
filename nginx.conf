# JOMS admin SPA + partner profile share links (https://kods.online/{username})
#
# Custom profile URLs must hit profile-service HTML (deeplink landing), NOT index.html.
# profile-service runs on the API host — proxied via profile.api.kods.online.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host profile.api.kods.online;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- profile-service share / deeplink (before SPA fallback) ---

    location /share {
        proxy_pass https://profile.api.kods.online;
    }

    location /.well-known {
        proxy_pass https://profile.api.kods.online;
    }

    location = /apple-app-site-association {
        proxy_pass https://profile.api.kods.online;
    }

    location = /api/deferred-deeplink {
        proxy_pass https://profile.api.kods.online;
    }

    # /{username} — e.g. https://kods.online/ranjithkumar
    location ~ ^/(?!auth|dev|dashboard|metrics|settings|my-tasks|referrals|support|memberships|finance|experts|services|categories|venues|communication|content-moderation|share|api|offerings|profile|health|favicon\.ico|robots\.txt|assets)[a-z][a-z0-9_-]{2,29}$ {
        proxy_pass https://profile.api.kods.online;
    }

    # --- React admin SPA ---

    location / {
        try_files $uri $uri/ /index.html;
    }
}
