# JOMS admin SPA + partner profile share links (https://kods.online/{username})
#
# /{username} paths are proxied to profile-service BEFORE the SPA fallback.
# profile-service renders the smart deeplink HTML page.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver needed for proxy_pass with variable / HTTPS upstream
    resolver 8.8.8.8 1.1.1.1 valid=30s;
    resolver_timeout 5s;

    # ----------------------------------------------------------------
    # /.well-known/* — App Links / Universal Links verification files
    # ----------------------------------------------------------------

    location ^~ /.well-known/ {
        proxy_pass          https://profile.api.kods.online;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              profile.api.kods.online;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location = /apple-app-site-association {
        proxy_pass          https://profile.api.kods.online;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              profile.api.kods.online;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # /share/* — profile share routes
    # ----------------------------------------------------------------

    location ^~ /share/ {
        proxy_pass          https://profile.api.kods.online;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              profile.api.kods.online;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # /api/deferred-deeplink — deferred deep-link resolution
    # ----------------------------------------------------------------

    location = /api/deferred-deeplink {
        proxy_pass          https://profile.api.kods.online;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              profile.api.kods.online;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # STEP 1 — Known SPA / admin paths → go straight to React app.
    # These are checked BEFORE the username regex below.
    # Add any new admin routes here.
    # ----------------------------------------------------------------

    location ^~ /auth          { try_files $uri $uri/ /index.html; }
    location ^~ /dashboard     { try_files $uri $uri/ /index.html; }
    location ^~ /dev           { try_files $uri $uri/ /index.html; }
    location ^~ /metrics       { try_files $uri $uri/ /index.html; }
    location ^~ /settings      { try_files $uri $uri/ /index.html; }
    location ^~ /my-tasks      { try_files $uri $uri/ /index.html; }
    location ^~ /referrals     { try_files $uri $uri/ /index.html; }
    location ^~ /support       { try_files $uri $uri/ /index.html; }
    location ^~ /memberships   { try_files $uri $uri/ /index.html; }
    location ^~ /finance       { try_files $uri $uri/ /index.html; }
    location ^~ /experts       { try_files $uri $uri/ /index.html; }
    location ^~ /services      { try_files $uri $uri/ /index.html; }
    location ^~ /categories    { try_files $uri $uri/ /index.html; }
    location ^~ /venues        { try_files $uri $uri/ /index.html; }
    location ^~ /communication { try_files $uri $uri/ /index.html; }
    location ^~ /content-moderation { try_files $uri $uri/ /index.html; }
    location ^~ /offerings     { try_files $uri $uri/ /index.html; }
    location ^~ /profile       { try_files $uri $uri/ /index.html; }

    # ----------------------------------------------------------------
    # STEP 2 — /{username}  →  profile-service deeplink page
    #
    # Matches: /anything  that is a single path segment (no slashes inside)
    # and is at least 2 characters long.
    # This runs AFTER the ^~ blocks above, so admin paths are already
    # handled and will never reach here.
    # ----------------------------------------------------------------

    location ~ ^/[^/]{2,}$ {
        proxy_pass          https://profile.api.kods.online;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              profile.api.kods.online;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # If profile-service returns 404 (username not found), fall back to SPA
        error_page 404 = @spa;
        # If profile-service is unreachable, also fall back to SPA
        error_page 502 503 504 = @spa;
    }

    # ----------------------------------------------------------------
    # Named location for SPA fallback (used by error_page above)
    # ----------------------------------------------------------------

    location @spa {
        try_files $uri /index.html;
    }

    # ----------------------------------------------------------------
    # React admin SPA — catch-all for everything else
    # ----------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
