pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint {staged_files}
    prettier:
      glob: '*.{js,jsx,ts,tsx,css,json,md,yml,yaml,html}'
      run: npx prettier --check {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: npm run typecheck

pre-push:
  parallel: false
  commands:
    build:
      run: npm run build
